name: Ephemeral Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-southeast-1
  TF_WORKING_DIR: infra/environments/dev

jobs:
  deploy-and-test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    environment:
      name: pr-${{ github.event.pull_request.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: OpenTofu init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tofu init

      - name: OpenTofu plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tofu plan \
            -var="environment=pr-${{ github.event.pull_request.number }}"

      - name: OpenTofu apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tofu apply \
            -auto-approve \
            -var="environment=pr-${{ github.event.pull_request.number }}"

      - name: Get API URL
        id: api
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "url=$(tofu output -raw api_url)" >> "$GITHUB_OUTPUT"

      - name: Run API tests
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          python -m pip install pytest requests
          pytest tests/api

      - name: Comment API URL
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.api.outputs.url }}";

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Ephemeral environment deployed\n\nAPI: ${url}`
            });

      - name: Destroy ephemeral environment
        if: always()
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tofu destroy \
            -auto-approve \
            -var="environment=pr-${{ github.event.pull_request.number }}"


  destroy:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: OpenTofu init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tofu init

      - name: Destroy ephemeral environment
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tofu destroy \
            -auto-approve \
            -var="environment=pr-${{ github.event.pull_request.number }}"
