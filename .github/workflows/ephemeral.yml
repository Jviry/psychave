name: Ephemeral Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-southeast-1
  TF_WORKING_DIR: infra/environments/dev
  PR_SCHEMA: pr_${{ github.event.pull_request.number }}

jobs:
  deploy-and-test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    environment:
      name: pr-${{ github.event.pull_request.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Package backend
        run: |
          rm -rf backend/package
          mkdir -p backend/package

          cp -r backend/src/. backend/package/

          pip install \
            -r backend/requirements.txt \
            -t backend/package

          cd backend/package
          zip -r ../lambda.zip .

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: OpenTofu Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tofu init \
            -backend-config=backend.hcl \
            -backend-config="key=ephemeral/pr-${{ github.event.pull_request.number }}/terraform.tfstate"

      - name: OpenTofu Plan
        working-directory: infra/environments/dev
        run: |
          tofu plan \
            -var-file="dev.tfvars" \
            -var="environment=pr-${{ github.event.pull_request.number }}" \
            -var="database_url=${{ secrets.DATABASE_URL }}" \
            -var="db_schema=${{ env.PR_SCHEMA }}"

      - name: Migrate and seed PR schema
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SCHEMA: ${{ env.PR_SCHEMA }}
          PYTHONPATH: package
        run: |
          python -m alembic upgrade head
          python src/seed_services.py

      - name: OpenTofu Apply
        working-directory: infra/environments/dev
        run: |
          tofu apply \
            -auto-approve \
            -var-file="dev.tfvars" \
            -var="environment=pr-${{ github.event.pull_request.number }}" \
            -var="database_url=${{ secrets.DATABASE_URL }}" \
            -var="db_schema=${{ env.PR_SCHEMA }}"

      - name: Get API and Cognito Outputs
        id: api
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "url=$(tofu output -raw api_endpoint)" >> "$GITHUB_OUTPUT"
          echo "cognito_user_pool_id=$(tofu output -raw cognito_user_pool_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_app_client_id=$(tofu output -raw cognito_app_client_id)" >> "$GITHUB_OUTPUT"

      - name: Comment API URL
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.api.outputs.url }}";
            const schema = "${{ env.PR_SCHEMA }}";

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Ephemeral environment deployed\n\nAPI: ${url}\nDB Schema: \`${schema}\``
            });

  destroy:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Package backend
        run: |
          rm -rf backend/package
          mkdir -p backend/package

          cp -r backend/src/. backend/package/

          pip install \
            -r backend/requirements.txt \
            -t backend/package

          cd backend/package
          zip -r ../lambda.zip .

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: OpenTofu init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tofu init -reconfigure \
            -backend-config=backend.hcl \
            -backend-config="key=ephemeral/pr-${{ github.event.pull_request.number }}/terraform.tfstate"

      - name: Destroy ephemeral environment
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tofu destroy \
            -auto-approve \
            -var-file="dev.tfvars" \
            -var="environment=pr-${{ github.event.pull_request.number }}" \
            -var="database_url=${{ secrets.DATABASE_URL }}" \
            -var="db_schema=${{ env.PR_SCHEMA }}"

      - name: Drop PR database schema
        if: always()
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SCHEMA: ${{ env.PR_SCHEMA }}
          PYTHONPATH: package
        run: |
          python src/drop_schema.py
