name: Deploy Dev

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # AWS authentication using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      # Python setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Package Lambda
      - name: Package backend
        run: |
          rm -rf backend/package
          mkdir -p backend/package

          # Copy application code
          cp -r backend/src/. backend/package/

          # Install dependencies into package directory
          pip install \
            -r backend/requirements.txt \
            -t backend/package

          # Create Lambda ZIP
          cd backend/package
          zip -r ../lambda.zip .

      # OpenTofu
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: OpenTofu Init
        working-directory: infra/environments/dev
        run: |
          tofu init -backend-config=backend.hcl

      - name: OpenTofu Plan
        working-directory: infra/environments/dev
        run: |
          tofu plan -var-file="dev.tfvars"

      - name: OpenTofu Apply
        working-directory: infra/environments/dev
        run: |
          tofu apply -auto-approve -var-file="dev.tfvars"
